name: MseisM CI/CD Pipeline

on:
  push:
    branches:
      - master
      - main
      - 'release/**'
  pull_request:
    branches:
      - master
      - main

# 同一分支同时只跑一个流水线，旧的自动取消
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/mseism

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: 代码安全扫描
  # ─────────────────────────────────────────────
  security-scan:
    name: 🔒 安全扫描
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json

      - name: 安装后端依赖
        working-directory: server
        run: npm ci

      - name: 安装前端依赖
        working-directory: client
        run: npm ci

      - name: 后端依赖漏洞扫描
        working-directory: server
        run: npm audit --audit-level=high
        continue-on-error: true  # 报告但不阻断（可按需改为 false）

      - name: 前端依赖漏洞扫描
        working-directory: client
        run: npm audit --audit-level=high
        continue-on-error: true

      - name: 敏感信息扫描（TruffleHog）
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --only-verified

  # ─────────────────────────────────────────────
  # JOB 2: 后端测试
  # ─────────────────────────────────────────────
  test-backend:
    name: 🧪 后端测试
    runs-on: ubuntu-latest
    needs: security-scan

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test_root_pass
          MYSQL_DATABASE: mseism_test
          MYSQL_USER: mseism_test
          MYSQL_PASSWORD: test_pass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: 安装后端依赖
        working-directory: server
        run: npm ci

      - name: 等待 MySQL 就绪
        run: |
          until mysqladmin ping -h 127.0.0.1 --silent; do
            echo "等待 MySQL..."
            sleep 2
          done

      - name: 初始化测试数据库
        run: |
          mysql -h 127.0.0.1 -u root -ptest_root_pass mseism_test < fix-database.sql || true

      - name: 运行后端测试
        working-directory: server
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USER: mseism_test
          DB_PASSWORD: test_pass
          DB_NAME: mseism_test
          JWT_SECRET: test-jwt-secret-for-ci-pipeline-only
        run: npm test -- --coverage --coverageReporters=lcov

      - name: 上传覆盖率报告
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: server/coverage/
          retention-days: 7

  # ─────────────────────────────────────────────
  # JOB 3: 前端构建 & 测试
  # ─────────────────────────────────────────────
  build-frontend:
    name: 🏗️ 前端构建
    runs-on: ubuntu-latest
    needs: security-scan

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: 安装前端依赖
        working-directory: client
        run: npm ci

      - name: 运行前端测试
        working-directory: client
        run: npm test -- --run --coverage
        continue-on-error: true

      - name: 构建前端（生产）
        working-directory: client
        env:
          VITE_API_URL: /api
          VITE_SOCKET_URL: ''
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: client/dist/
          retention-days: 3

  # ─────────────────────────────────────────────
  # JOB 4: 构建 Docker 镜像（仅 master/release 分支）
  # ─────────────────────────────────────────────
  build-images:
    name: 🐳 构建镜像
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/release/'))
    permissions:
      contents: read
      packages: write

    outputs:
      backend_image: ${{ steps.meta-backend.outputs.tags }}
      frontend_image: ${{ steps.meta-frontend.outputs.tags }}
      version: ${{ steps.version.outputs.tag }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载前端构建产物
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: client/dist/

      - name: 生成版本号
        id: version
        run: |
          SHORT_SHA=${GITHUB_SHA::8}
          echo "tag=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "版本: ${SHORT_SHA}"

      - name: 登录容器注册表
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 提取后端镜像元数据
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-backend
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 提取前端镜像元数据
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-frontend
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送后端镜像
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILD_DATE=${{ github.event.head_commit.timestamp }}
            VCS_REF=${{ github.sha }}

      - name: 构建并推送前端镜像
        uses: docker/build-push-action@v5
        with:
          context: ./client
          file: ./client/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────
  # JOB 5: 部署到生产服务器
  # ─────────────────────────────────────────────
  deploy-production:
    name: 🚀 部署生产
    runs-on: ubuntu-latest
    needs: build-images
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    environment:
      name: production
      url: http://${{ secrets.SERVER_HOST }}

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 部署到服务器
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            export DEPLOY_VERSION="${{ needs.build-images.outputs.version }}"
            export REGISTRY="${{ env.REGISTRY }}"
            export IMAGE_PREFIX="${{ env.IMAGE_PREFIX }}"

            echo "=== 开始部署 MseisM (版本: ${DEPLOY_VERSION}) ==="

            # 执行部署脚本
            cd /opt/mseism
            bash scripts/deploy.sh "${DEPLOY_VERSION}"

      - name: 部署健康检查
        run: |
          echo "等待服务启动..."
          sleep 15
          MAX_RETRIES=10
          COUNT=0
          until curl -sf "http://${{ secrets.SERVER_HOST }}/api/health" > /dev/null; do
            COUNT=$((COUNT+1))
            if [ $COUNT -ge $MAX_RETRIES ]; then
              echo "❌ 健康检查失败，触发回滚..."
              exit 1
            fi
            echo "等待服务就绪... ($COUNT/$MAX_RETRIES)"
            sleep 10
          done
          echo "✅ 部署成功，服务健康"

      - name: 发送部署通知
        if: always()
        uses: appleboy/telegram-action@master
        continue-on-error: true
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: |
            ${{ job.status == 'success' && '✅' || '❌' }} MseisM 部署${{ job.status == 'success' && '成功' || '失败' }}
            版本: ${{ needs.build-images.outputs.version }}
            分支: ${{ github.ref_name }}
            提交: ${{ github.event.head_commit.message }}
            操作者: ${{ github.actor }}
